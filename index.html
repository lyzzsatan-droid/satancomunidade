<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="css/style.css">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satan — comunidades</title>
</head>
<body>
<div id="root"></div><div id="modal-root"></div><div id="toast" class="toast"></div>
<script>
(()=>{
'use strict';
const KEY='nexo_demo_data_v1', SESSION='nexo_demo_user';
const root=document.getElementById('root'), modalRoot=document.getElementById('modal-root');
let state; try{state=JSON.parse(localStorage.getItem(KEY))||{users:[],servers:[],friends:[],messages:{}}}catch(e){state={users:[],servers:[],friends:[],messages:{}}}
let currentId=sessionStorage.getItem(SESSION)||'', activeServerId='', activeDMId='', activeChannelId='', mobileView='list';
const id=()=>Math.random().toString(36).slice(2,10);
const user=()=>state.users.find(x=>x.id===currentId);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('O armazenamento do navegador ficou cheio. Reduza o tamanho da foto.');return false}};
const toast=(msg)=>{let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
function avatarHTML(u,sz=''){let initial=esc((u?.displayName||u?.username||'?').trim().charAt(0).toUpperCase());return `<span class="avatar ${sz}">${u?.avatar?`<img src="${u.avatar}" alt="">`:initial}</span>`}
function hashPass(pass){if(window.crypto?.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''))}let h=2166136261;for(let i=0;i<pass.length;i++){h^=pass.charCodeAt(i);h=Math.imul(h,16777619)}return Promise.resolve('local-'+(h>>>0).toString(16))}
function authView(mode='signup',error=''){root.innerHTML=`<main class="auth-wrap"><section class="auth-card"><div class="brand"><span class="brand-mark">S</span><span>Satan</span></div><h1>Encontre sua comunidade</h1><p>Converse, crie servidores e reúna sua galera em um só lugar.</p><div class="tabs"><button data-auth="signup" class="${mode==='signup'?'active':''}">Criar conta</button><button data-auth="login" class="${mode==='login'?'active':''}">Entrar</button></div><form id="auth-form"><div id="display-wrap" class="${mode==='login'?'hidden':''}"><label for="display">Como quer ser chamado?</label><input class="field" id="display" maxlength="32" placeholder="Seu nome de exibição"></div><label for="username">Nome de usuário</label><input class="field" id="username" autocomplete="username" minlength="3" maxlength="24" placeholder="ex.: lucas_23" required><label for="password">Senha</label><input class="field" id="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" minlength="6" placeholder="Pelo menos 6 caracteres" required><div class="error">${esc(error)}</div><button class="btn full" type="submit">${mode==='login'?'Entrar':'Criar minha conta'}</button></form><div class="notice"><b>Protótipo local:</b> os dados ficam somente neste navegador e neste aparelho. Não use uma senha que você usa em outros serviços; ainda não é uma plataforma online multiusuário.</div></section></main>`;
root.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>authView(b.dataset.auth));
root.querySelector('#auth-form').onsubmit=async ev=>{ev.preventDefault();const name=root.querySelector('#username').value.trim().replace(/^@/,'');const pass=root.querySelector('#password').value;const display=root.querySelector('#display')?.value.trim()||name;if(name.length<3)return authView(mode,'O nome de usuário precisa ter ao menos 3 caracteres.');if(pass.length<6)return authView(mode,'A senha precisa ter ao menos 6 caracteres.');let found=state.users.find(x=>x.username.toLowerCase()===name.toLowerCase());if(mode==='signup'&&found)return authView(mode,'Esse nome de usuário já está em uso neste navegador.');let digest=await hashPass(pass);if(mode==='login'){if(!found||found.passHash!==digest)return authView(mode,'Usuário ou senha não encontrados.');currentId=found.id}else{let u={id:id(),username:name,displayName:display,passHash:digest,avatar:'',bio:'',createdAt:Date.now()};state.users.push(u);currentId=u.id;save()}sessionStorage.setItem(SESSION,currentId);activeServerId='';activeDMId='';render()};
}
function getFriends(){return state.friends.filter(f=>f.users.includes(currentId)).map(f=>state.users.find(u=>u.id===f.users.find(x=>x!==currentId))).filter(Boolean)}
function serversForMe(){return state.servers.filter(s=>s.members.some(m=>m.userId===currentId))}
function roleFor(s,uid){let m=s.members.find(x=>x.userId===uid);return s.roles.find(r=>r.id===m?.roleId)||s.roles.find(r=>r.id==='member')}
function activeServer(){return state.servers.find(s=>s.id===activeServerId)}
function render(){if(!user()){authView();return}const me=user(), friends=getFriends(), servers=serversForMe(), server=activeServer();if(server&&!server.channels.some(c=>c.id===activeChannelId))activeChannelId=server.channels[0]?.id||'';let channel=server?.channels.find(c=>c.id===activeChannelId);let dm=state.users.find(u=>u.id===activeDMId);
let rail=`<button class="rail-icon ${!server&&!dm?'active':''}" data-action="home" title="Início">⌂</button><div class="rail-divider"></div>${servers.map(s=>`<button class="rail-icon ${server?.id===s.id?'active':''}" data-server="${s.id}" title="${esc(s.name)}">${esc(s.emoji||s.name.charAt(0).toUpperCase())}</button>`).join('')}<button class="rail-icon" data-action="new-server" title="Criar servidor">＋</button><div class="rail-bottom"><button class="rail-icon" data-action="profile" title="Meu perfil">${me.avatar?`<img src="${me.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:esc(me.displayName.charAt(0).toUpperCase())}</button></div>`;
let side='';if(server){side=`<div class="side-head"><span>${esc(server.name)}</span><button class="icon-btn" data-action="server-settings" title="Configurações">⚙</button></div><div class="side-content"><div class="section-title">Canais <button class="text-btn" data-action="add-channel" title="Adicionar canal">＋</button></div>${server.channels.map(c=>`<div class="side-row ${channel?.id===c.id?'active':''}" data-channel="${c.id}"><span class="muted">#</span><span>${esc(c.name)}</span></div>`).join('')}<div class="section-title" style="margin-top:18px">Cargos <button class="text-btn" data-action="server-roles" title="Criar e editar cargos">＋</button></div>${server.roles.map(r=>`<div class="side-row" data-action="server-roles"><span class="role-dot" style="background:${esc(r.color)}"></span><span>${esc(r.name)}</span></div>`).join('')}<div class="section-title" style="margin-top:18px">Membros <button class="text-btn" data-action="add-member" title="Adicionar membro">＋</button></div>${server.members.map(m=>{let u=state.users.find(x=>x.id===m.userId),r=roleFor(server,m.userId);return u?`<div class="side-row" title="${esc(r?.name||'Membro')}">${avatarHTML(u,'sm')}<div class="person-name">${esc(u.displayName)}</div></div>`:''}).join('')}</div>`}else{side=`<div class="side-head"><span>Mensagens</span><button class="icon-btn" data-action="profile" title="Perfil">⚙</button></div><div class="side-content"><div class="side-row ${!dm?'active':''}" data-action="home"><span>🏠</span><span>Início</span></div><div class="section-title" style="margin-top:15px">Amigos <button class="text-btn" data-action="add-friend" title="Adicionar amigo">＋</button></div>${friends.length?friends.map(f=>`<div class="side-row ${dm?.id===f.id?'active':''}" data-dm="${f.id}">${avatarHTML(f,'sm')}<div style="min-width:0"><div class="person-name">${esc(f.displayName)}</div><div class="handle">@${esc(f.username)}</div></div></div>`).join(''):`<div class="muted small" style="padding:8px">Adicione alguém pelo nome de usuário.</div>`}</div>`}
let main='';if(server){main=`<header class="topbar"><button class="icon-btn mobile-menu" data-action="mobile-channels" title="Canais e servidores">‹</button><span class="muted">#</span><span class="topbar-title">${esc(channel?.name||'canal')}</span><div class="topbar-actions"><button class="icon-btn" data-action="add-member" title="Adicionar membro">♙＋</button><button class="icon-btn" data-action="server-roles" title="Cargos do servidor">♟</button><button class="icon-btn" data-action="server-settings" title="Configurações do servidor">⚙</button></div></header><section class="chat-area"><div class="messages" id="messages"></div><div class="composer-wrap"><form id="composer" class="composer"><input id="message-input" maxlength="2000" placeholder="Mensagem em #${esc(channel?.name||'canal')}" autocomplete="off"><button type="submit" title="Enviar">➤</button></form></div></section>`}else if(dm){main=`<header class="topbar"><button class="icon-btn mobile-menu" data-action="mobile-channels" title="Mensagens">‹</button>${avatarHTML(dm,'sm')}<span class="topbar-title">${esc(dm.displayName)}</span><span class="pill">@${esc(dm.username)}</span></header><section class="chat-area"><div class="messages" id="messages"></div><div class="composer-wrap"><form id="composer" class="composer"><input id="message-input" maxlength="2000" placeholder="Mensagem para ${esc(dm.displayName)}" autocomplete="off"><button type="submit">➤</button></form></div></section>`}else{main=`<header class="topbar"><span class="topbar-title">Satan</span><div class="topbar-actions"><button class="icon-btn" data-action="profile" title="Meu perfil">👤</button></div></header><div class="content"><div class="welcome"><h1>Oi, ${esc(me.displayName)} 👋</h1><p>Seu espaço para conversar e criar comunidades.</p><div class="card-grid"><article class="card"><div class="card-icon">🪄</div><h3>Crie seu servidor</h3><p>Monte um espaço para sua comunidade, organize canais e distribua cargos.</p><button class="btn" data-action="new-server">Criar servidor</button></article><article class="card"><div class="card-icon">🔎</div><h3>Encontre alguém</h3><p>Adicione amigos usando o nome de usuário deles.</p><button class="btn secondary" data-action="add-friend">Adicionar amigo</button></article><article class="card"><div class="card-icon">🖼️</div><h3>Personalize seu perfil</h3><p>Escolha uma foto da galeria e defina como quer aparecer.</p><button class="btn secondary" data-action="profile">Editar perfil</button></article></div><div class="card" style="margin-top:16px"><h3>Seus servidores</h3><p>${servers.length?`Você participa de ${servers.length} servidor${servers.length===1?'':'es'}. Escolha um na barra lateral.`:'Ainda não participa de nenhum servidor.'}</p></div></div></div>`}
let members=server?`<aside class="members-panel"><div class="section-title">MEMBROS — ${server.members.length}</div>${server.members.map(m=>{let u=state.users.find(x=>x.id===m.userId),r=roleFor(server,m.userId);return u?`<div class="member-row">${avatarHTML(u,'sm')}<div class="member-label" title="${esc(u.displayName)}"><span class="role-dot" style="background:${esc(r?.color||'#aab0bb')}"></span>${esc(u.displayName)}</div></div>`:''}).join('')}</aside>`:'';
root.innerHTML=`<div class="app ${matchMedia('(max-width:490px)').matches&&(server||dm)&&mobileView==='chat'?'show-main':''}"><nav class="server-rail">${rail}</nav><aside class="side-panel">${side}<div class="side-user">${avatarHTML(me,'sm')}<div class="side-user-info"><div class="person-name">${esc(me.displayName)}</div><div class="handle">@${esc(me.username)}</div></div><button class="icon-btn" data-action="logout" title="Sair">⇥</button></div></aside><main class="main">${main}</main>${members}</div>`;
root.querySelectorAll('[data-server]').forEach(b=>b.onclick=()=>{activeServerId=b.dataset.server;activeDMId='';activeChannelId=state.servers.find(s=>s.id===activeServerId)?.channels[0]?.id||'';mobileView=matchMedia('(max-width:490px)').matches?'list':'chat';render()});root.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{activeChannelId=b.dataset.channel;mobileView='chat';render()});root.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{activeDMId=b.dataset.dm;activeServerId='';mobileView='chat';render()});root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));const cf=root.querySelector('#composer');if(cf)cf.onsubmit=sendMessage;
if(server||dm)renderMessages(server,channel,dm);
}
function messageKey(server,channel,dm){if(server)return `s:${server.id}:${channel?.id||''}`;let pair=[currentId,dm.id].sort().join(':');return `d:${pair}`}
function renderMessages(server,channel,dm){let box=document.getElementById('messages');if(!box)return;let msgs=state.messages[messageKey(server,channel,dm)]||[];if(!msgs.length){box.innerHTML=`<div class="chat-empty"><div class="big">${server?'#':'👋'}</div><b>${server?`Bem-vindo a #${esc(channel?.name||'canal')}`:`Conversa com ${esc(dm.displayName)}`}</b><p>${server?'Este é o começo do canal. Mande a primeira mensagem!':'As mensagens desta conversa aparecem aqui.'}</p></div>`;return}box.innerHTML=msgs.map(m=>{let u=state.users.find(x=>x.id===m.userId)||{displayName:'Conta',username:'',avatar:''};let date=new Date(m.time);return `<div class="message">${avatarHTML(u)}<div class="message-body"><div class="message-meta"><span class="message-author">${esc(u.displayName)}</span><span class="message-time">${date.toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="message-text">${esc(m.text)}</div></div></div>`}).join('');box.scrollTop=box.scrollHeight}
function sendMessage(ev){ev.preventDefault();let input=document.getElementById('message-input'),text=input.value.trim();if(!text)return;let server=activeServer(),channel=server?.channels.find(c=>c.id===activeChannelId),dm=state.users.find(u=>u.id===activeDMId);if(!server&&!dm)return;let k=messageKey(server,channel,dm);state.messages[k]??=[];state.messages[k].push({id:id(),userId:currentId,text,time:Date.now()});save();input.value='';renderMessages(server,channel,dm)}
function modal(title,body,after){modalRoot.innerHTML=`<div class="modal-bg"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-close>✕</button></div>${body}</section></div>`;modalRoot.querySelector('[data-close]').onclick=closeModal;modalRoot.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal()};if(after)after()}
function closeModal(){modalRoot.innerHTML=''}
function act(a){if(a==='home'){activeServerId='';activeDMId='';mobileView='list';render()}else if(a==='new-server')newServerModal();else if(a==='profile')profileModal();else if(a==='add-friend')friendModal();else if(a==='add-member')memberModal();else if(a==='server-settings'||a==='server-roles')settingsModal();else if(a==='add-channel')channelModal();else if(a==='mobile-channels'){mobileView='list';render()}else if(a==='logout'){sessionStorage.removeItem(SESSION);currentId='';activeServerId='';activeDMId='';mobileView='list';authView()}else if(a==='back'){mobileView='list';render()}}
function newServerModal(){modal('Criar servidor',`<p class="muted small">Dê um nome ao seu espaço. Você será o dono e poderá criar canais e cargos.</p><form id="new-server-form"><label>Nome do servidor</label><input class="field" name="name" maxlength="40" placeholder="Minha comunidade" required><div class="split"><div><label>Ícone (emoji)</label><input class="field" name="emoji" maxlength="4" value="🌟" placeholder="🌟"></div><div><label>Descrição (opcional)</label><input class="field" name="description" maxlength="100" placeholder="Sobre a comunidade"></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn">Criar servidor</button></div></form>`,()=>{modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);modalRoot.querySelector('#new-server-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),sid=id(),owner={id:'owner',name:'Dono',color:'#f1c75b'},member={id:'member',name:'Membro',color:'#aab0bb'};let s={id:sid,name:String(f.get('name')).trim(),emoji:String(f.get('emoji')).trim()||'🌟',description:String(f.get('description')).trim(),channels:[{id:id(),name:'geral'}],roles:[owner,member],members:[{userId:currentId,roleId:'owner'}]};state.servers.push(s);save();activeServerId=sid;activeChannelId=s.channels[0].id;activeDMId='';mobileView=matchMedia('(max-width:490px)').matches?'list':'chat';closeModal();render();toast('Servidor criado!')};})}
function friendModal(){modal('Adicionar amigo',`<p class="muted small">Digite o nome de usuário exato. A busca funciona entre contas criadas neste mesmo navegador.</p><form id="friend-form"><label>Nome de usuário</label><div style="display:flex;gap:8px"><input class="field" name="username" placeholder="@nome_de_usuario" required><button class="btn">Adicionar</button></div><div id="friend-result" class="error"></div></form>`,()=>{modalRoot.querySelector('#friend-form').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('username').trim().replace(/^@/,'');let target=state.users.find(u=>u.username.toLowerCase()===name.toLowerCase());let result=modalRoot.querySelector('#friend-result');if(!target){result.textContent='Não encontrei essa conta neste navegador.';return}if(target.id===currentId){result.textContent='Esse é o seu próprio usuário.';return}if(state.friends.some(f=>f.users.includes(currentId)&&f.users.includes(target.id))){result.textContent='Essa pessoa já está na sua lista.';return}state.friends.push({users:[currentId,target.id]});save();closeModal();render();toast(`@${target.username} foi adicionado!`)}})}
function memberModal(){let s=activeServer();if(!s)return;modal('Adicionar membro',`<p class="muted small">Adicione uma conta pelo nome de usuário. Nesta demonstração, a conta precisa existir neste navegador.</p><form id="member-form"><label>Nome de usuário</label><div style="display:flex;gap:8px"><input class="field" name="username" placeholder="@nome_de_usuario" required><button class="btn">Adicionar</button></div><div id="member-result" class="error"></div></form>`,()=>{modalRoot.querySelector('#member-form').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('username').trim().replace(/^@/,''),u=state.users.find(x=>x.username.toLowerCase()===name.toLowerCase()),result=modalRoot.querySelector('#member-result');if(!u){result.textContent='Não encontrei essa conta neste navegador.';return}if(s.members.some(m=>m.userId===u.id)){result.textContent='Essa pessoa já está no servidor.';return}s.members.push({userId:u.id,roleId:s.roles.find(r=>r.id==='member')?.id||s.roles[0].id});save();closeModal();render();toast(`${u.displayName} entrou no servidor.`)}})}
function channelModal(){let s=activeServer();if(!s)return;modal('Criar canal',`<form id="channel-form"><label>Nome do canal</label><input class="field" name="name" maxlength="32" placeholder="novidades" required><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn">Criar canal</button></div></form>`,()=>{modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);modalRoot.querySelector('#channel-form').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim().toLowerCase().replace(/\s+/g,'-');let c={id:id(),name};s.channels.push(c);activeChannelId=c.id;save();closeModal();render()}})}
function settingsModal(){let s=activeServer();if(!s)return;let isOwner=s.members.find(m=>m.userId===currentId)?.roleId==='owner';modal('Personalizar servidor',`<form id="server-form"><div class="split"><div><label>Nome</label><input class="field" name="name" maxlength="40" value="${esc(s.name)}" ${isOwner?'':'disabled'}></div><div><label>Ícone</label><input class="field" name="emoji" maxlength="4" value="${esc(s.emoji)}" ${isOwner?'':'disabled'}></div></div><label>Descrição</label><input class="field" name="description" maxlength="100" value="${esc(s.description||'')}" placeholder="Sobre o servidor" ${isOwner?'':'disabled'}><div class="modal-actions"><button type="button" class="btn secondary" data-close>Fechar</button>${isOwner?'<button class="btn">Salvar alterações</button>':''}</div></form><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3 style="font-size:15px">Cargos e membros</h3><p class="muted small">Crie cargos e atribua um cargo a cada membro.</p><form id="role-form" class="${isOwner?'':'hidden'}"><div class="split"><div><label>Novo cargo</label><input class="field" name="role" maxlength="24" placeholder="Moderador" required></div><div><label>Cor</label><input class="field" style="height:43px;padding:5px" type="color" name="color" value="#7587ff"></div></div><button class="btn secondary" style="margin-top:10px">Criar cargo</button></form><div style="margin-top:12px">${s.roles.map(r=>`<div class="role-item"><span class="role-swatch" style="background:${esc(r.color)}"></span><span>${esc(r.name)}</span>${r.id!=='owner'&&r.id!=='member'&&isOwner?`<button class="text-btn" style="margin-left:auto" data-delete-role="${r.id}" title="Excluir cargo">Excluir</button>`:''}</div>`).join('')}</div><div style="margin-top:15px"><label>Definir cargo dos membros</label>${s.members.map(m=>{let u=state.users.find(x=>x.id===m.userId);if(!u)return'';return `<div class="split" style="align-items:center;margin:8px 0"><div class="person-name">${esc(u.displayName)}</div><select class="field role-select" data-user="${m.userId}" ${isOwner&&m.roleId!=='owner'?'':'disabled'}>${s.roles.filter(r=>r.id!=='owner'||m.roleId==='owner').map(r=>`<option value="${r.id}" ${m.roleId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>`}).join('')}</div>`,()=>{modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);let sf=modalRoot.querySelector('#server-form');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);s.name=String(f.get('name')).trim()||s.name;s.emoji=String(f.get('emoji')).trim()||'🌟';s.description=String(f.get('description')).trim();save();closeModal();render();toast('Servidor atualizado.')};modalRoot.querySelector('#role-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('role')).trim();if(s.roles.some(r=>r.name.toLowerCase()===name.toLowerCase()))return toast('Já existe um cargo com esse nome.');s.roles.push({id:id(),name,color:String(f.get('color'))||'#7587ff'});save();settingsModal()};modalRoot.querySelectorAll('.role-select').forEach(sel=>sel.onchange=()=>{let m=s.members.find(x=>x.userId===sel.dataset.user);if(m&&isOwner){m.roleId=sel.value;save();render();settingsModal()}});modalRoot.querySelectorAll('[data-delete-role]').forEach(b=>b.onclick=()=>{let rid=b.dataset.deleteRole;if(s.members.some(m=>m.roleId===rid))return toast('Atribua outro cargo antes de excluir.');s.roles=s.roles.filter(r=>r.id!==rid);save();settingsModal()})})}
function profileModal(){let me=user();modal('Seu perfil',`<form id="profile-form"><div class="profile-edit">${avatarHTML(me,'lg')}<div><label class="file-label" for="avatar-file">Escolher foto da galeria</label><input class="hide-file" id="avatar-file" type="file" accept="image/*"><div class="muted small" style="margin-top:7px">A imagem é reduzida para caber no armazenamento local.</div></div></div><label>Nome de exibição</label><input class="field" name="displayName" maxlength="32" value="${esc(me.displayName)}" required><label>Nome de usuário</label><input class="field" name="username" minlength="3" maxlength="24" value="${esc(me.username)}" required><label>Sobre mim</label><textarea class="field" name="bio" maxlength="160" rows="3" placeholder="Conte um pouco sobre você">${esc(me.bio||'')}</textarea><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn">Salvar perfil</button></div></form>`,()=>{modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);let newPhoto='';modalRoot.querySelector('#avatar-file').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('Escolha um arquivo de imagem.');try{newPhoto=await shrinkImage(file);modalRoot.querySelector('.profile-edit .avatar').innerHTML=`<img src="${newPhoto}" alt="">`}catch(err){toast('Não consegui abrir essa imagem.')}};modalRoot.querySelector('#profile-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('username')).trim().replace(/^@/,''),exists=state.users.find(x=>x.username.toLowerCase()===name.toLowerCase()&&x.id!==currentId);if(name.length<3)return toast('O usuário precisa ter ao menos 3 caracteres.');if(exists)return toast('Esse nome de usuário já está em uso.');me.displayName=String(f.get('displayName')).trim()||me.displayName;me.username=name;me.bio=String(f.get('bio')).trim();if(newPhoto)me.avatar=newPhoto;save();closeModal();render();toast('Perfil atualizado!')}})}
function shrinkImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let max=320,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
if(!user())authView();else render();
})();
</script>
</body>
</html>
